import csv
import configparser

config = configparser.ConfigParser()
config.read("reviews.ini", encoding="utf-8")

with open("reviews.csv", "w", encoding="utf-8-sig", newline="") as csvfile:
    writer = csv.writer(csvfile)
    writer.writerow(["หัวข้อ", "ผู้โพสต์", "วันที่", "ข้อความรีวิว"])
    
    for section in config.sections():
        writer.writerow([
            config[section]["หัวข้อ"],
            config[section]["ผู้โพสต์"],
            config[section]["วันที่"],
            config[section]["ข้อความรีวิว"]
        ])
        
